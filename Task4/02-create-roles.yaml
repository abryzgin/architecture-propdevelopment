apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer
rules:
  - apiGroups: ["", "apps", "extensions"]
    resources:
      - pods
      - services
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-operator
rules:
  - apiGroups: ["", "apps", "extensions"]
    resources:
      - pods
      - services
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

# исключаем secret/node/rbac, чтобы эта роль не имела критичных прав.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: privileged
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
